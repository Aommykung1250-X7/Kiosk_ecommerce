map $http_x_forwarded_proto $kiosk_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    # ONNX background-removal workers are emitted as .mjs by the frontend build.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Re-resolve the API after Docker recreates its container with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kiosk_backend backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiosk_forwarded_proto;
    proxy_set_header Connection "";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://$kiosk_backend$request_uri;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }

    location /uploads/ {
        proxy_pass http://$kiosk_backend$request_uri;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
